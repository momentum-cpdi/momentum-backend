global:
  smtp_smarthost: "mailpit:1025"
  smtp_from: "alertmanager@momentum.local"
  smtp_require_tls: false

route:
  receiver: email
  group_by: [alertname, job]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: email
    email_configs:
      - to: "oncall@momentum.local"
        send_resolved: true
