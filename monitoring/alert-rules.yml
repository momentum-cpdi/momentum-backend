groups:
  - name: momentum-availability
    rules:
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.job }} is down"
          description: "Prometheus has been unable to scrape {{ $labels.instance }} ({{ $labels.job }}) for more than 1 minute."

      - alert: HighErrorRate
        expr: |
          sum by (application) (rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
            /
          sum by (application) (rate(http_server_requests_seconds_count[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High 5xx error rate on {{ $labels.application }}"
          description: "More than 5% of requests to {{ $labels.application }} have returned 5xx for the last 5 minutes."

      - alert: DbPoolSaturated
        expr: hikaricp_connections_pending > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Database connection pool saturated on {{ $labels.application }}"
          description: "Requests have been waiting for a database connection for more than 2 minutes."
