name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Trivy scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy.sarif'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'

      - name: Upload Trivy report
        uses: actions/upload-artifact@v4
        if: always() && hashFiles('trivy.sarif') != ''
        with:
          name: trivy-report
          path: trivy.sarif

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build & test all modules
        run: mvn --batch-mode verify

      - name: Build images
        run: |
          docker build -t momentum-api:ci ./momentum-api
          docker build -t momentum-ingest-api:ci ./momentum-ingest-api
          
      - name: Scan image API
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'image'
          image-ref: 'momentum-api:ci'
          format: 'sarif'
          output: 'trivy-api.sarif'
          severity: 'HIGH,CRITICAL'
          exit-code: 1

      - name: Scan image INGEST-API
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'image'
          image-ref: 'momentum-ingest-api:ci'
          format: 'sarif'
          output: 'trivy-ingest-api.sarif'
          severity: 'HIGH,CRITICAL'
          exit-code: 1

      - name: Upload image reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-image-reports
          path: trivy-*.sarif
          if-no-files-found: ignore